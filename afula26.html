<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover, shrink-to-fit=no">
  <title>רישום לצילום | גביע עפולה</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0a0a0a;
      font-family: 'Segoe UI', 'Assistant', 'Rubik', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      margin: 0;
      direction: rtl;
    }

    .container {
      width: 100%;
      max-width: 750px;
      background: #1a1a1a;
      border-radius: 40px;
      box-shadow: 0 30px 50px rgba(0, 0, 0, 0.5), 0 10px 20px rgba(212, 175, 55, 0.1);
      padding: 2rem 1.8rem;
      border: 1px solid #333;
    }

    h1 {
      text-align: center;
      font-size: 2.3rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 0.4rem;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    h1 span {
      background: #d4af37;
      color: #000;
      font-size: 1.8rem;
      padding: 0.2rem 1.2rem;
      border-radius: 50px;
      font-weight: 800;
    }

    .subtitle {
      text-align: center;
      color: #cccccc;
      font-size: 1.1rem;
      margin-bottom: 2rem;
      border-bottom: 2px dashed #d4af37;
      padding-bottom: 0.8rem;
    }

    .steps-indicator {
      display: flex;
      justify-content: space-between;
      margin-bottom: 2.2rem;
      background: #2a2a2a;
      border-radius: 50px;
      padding: 0.4rem;
      position: relative;
    }
    .step {
      flex: 1;
      text-align: center;
      padding: 0.7rem 0.5rem;
      border-radius: 40px;
      font-weight: 600;
      color: #999;
      transition: 0.3s;
      cursor: default;
      font-size: 0.95rem;
      background: transparent;
      z-index: 1;
    }
    .step.active {
      background: #d4af37;
      color: #000;
      box-shadow: 0 4px 12px rgba(212, 175, 55, 0.4);
      font-weight: 700;
    }

    .form-step {
      display: none;
      animation: fadeSlide 0.4s ease;
    }
    .form-step.active-step {
      display: block;
    }

    @keyframes fadeSlide {
      from { opacity: 0.5; transform: translateX(-15px); }
      to { opacity: 1; transform: translateX(0); }
    }

    label {
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 0.3rem;
      display: block;
      font-size: 1rem;
    }

    input, select, textarea {
      width: 100%;
      padding: 0.85rem 1rem;
      border: 1.5px solid #444;
      border-radius: 20px;
      font-size: 1rem;
      background: #2a2a2a;
      color: #ffffff;
      transition: 0.2s;
      outline: none;
      font-family: inherit;
      margin-bottom: 1rem;
    }
    input::placeholder {
      color: #888;
    }
    input:focus
