<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover, shrink-to-fit=no">
  <title>רישום לצילום | גביע עפולה</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(145deg, #f5f0e7 0%, #e8e0d3 100%);
      font-family: 'Segoe UI', 'Assistant', 'Rubik', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      margin: 0;
      direction: rtl;
    }

    .container {
      width: 100%;
      max-width: 750px;
      background: rgba(255, 250, 245, 0.9);
      backdrop-filter: blur(20px);
      background: #fffcf5;
      border-radius: 40px;
      box-shadow: 0 30px 50px rgba(0, 0, 0, 0.15), 0 10px 20px rgba(140, 90, 40, 0.1);
      padding: 2rem 1.8rem;
      border: 1px solid rgba(200, 170, 120, 0.3);
    }

    h1 {
      text-align: center;
      font-size: 2.3rem;
      font-weight: 700;
      color: #3a2c1b;
      margin-bottom: 0.4rem;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    h1 span {
      background: #d4af37;
      color: #2e2412;
      font-size: 1.8rem;
      padding: 0.2rem 1.2rem;
      border-radius: 50px;
    }

    .subtitle {
      text-align: center;
      color: #5e4a32;
      font-size: 1.1rem;
      margin-bottom: 2rem;
      border-bottom: 2px dashed #cfb48b;
      padding-bottom: 0.8rem;
    }

    .steps-indicator {
      display: flex;
      justify-content: space-between;
      margin-bottom: 2.2rem;
      background: #ede3d3;
      border-radius: 50px;
      padding: 0.4rem;
      position: relative;
    }
    .step {
      flex: 1;
      text-align: center;
      padding: 0.7rem 0.5rem;
      border-radius: 40px;
      font-weight: 600;
      color: #5f4a33;
      transition: 0.3s;
      cursor: default;
      font-size: 0.95rem;
      background: transparent;
      z-index: 1;
    }
    .step.active {
      background: #b2905f;
      color: white;
      box-shadow: 0 4px 12px rgba(140, 100, 50, 0.4);
      font-weight: 700;
    }

    .form-step {
      display: none;
      animation: fadeSlide 0.4s ease;
    }
    .form-step.active-step {
      display: block;
    }

    @keyframes fadeSlide {
      from { opacity: 0.5; transform: translateX(-15px); }
      to { opacity: 1; transform: translateX(0); }
    }

    label {
      font-weight: 600;
      color: #3e3324;
      margin-bottom: 0.3rem;
      display: block;
      font-size: 1rem;
    }

    input, select, textarea {
      width: 100%;
      padding: 0.85rem 1rem;
      border: 1.5px solid #dac29c;
      border-radius: 20px;
      font-size: 1rem;
      background: #fffef9;
      transition: 0.2s;
      outline: none;
      font-family: inherit;
      margin-bottom: 1rem;
    }
    input:focus, select:focus {
      border-color: #b2905f;
      box-shadow: 0 0 0 4px rgba(178, 144, 95, 0.2);
    }

    .radio-group, .checkbox-group {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 1.2rem;
      background: #faf6ef;
      padding: 0.8rem 1rem;
      border-radius: 24px;
    }
    .radio-option, .checkbox-option {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      background: white;
      padding: 0.4rem 1rem;
      border-radius: 30px;
      border: 1px solid #cfb48b;
    }
    .radio-option input, .checkbox-option input {
      width: auto;
      margin: 0;
    }

    .category-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 0.8rem;
      margin-top: 0.5rem;
    }
    .category-card {
      background: #fdfaf3;
      border: 1px solid #e1caa5;
      border-radius: 20px;
      padding: 0.7rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.9rem;
      font-weight: 500;
      transition: 0.2s;
    }
    .category-card input {
      width: auto;
      margin: 0;
    }

    .nav-buttons {
      display: flex;
      justify-content: space-between;
      margin-top: 2rem;
      gap: 1rem;
    }
    button {
      background: #c9a87c;
      border: none;
      color: white;
      font-weight: 700;
      padding: 0.9rem 2rem;
      border-radius: 35px;
      font-size: 1.1rem;
      cursor: pointer;
      transition: 0.3s;
      box-shadow: 0 6px 14px rgba(160, 120, 70, 0.3);
      border: 1px solid #e7c394;
      letter-spacing: 0.5px;
    }
    button:hover {
      background: #b58d5a;
      transform: translateY(-2px);
    }
    button.secondary {
      background: #e7dbc9;
      color: #4d3a24;
      box-shadow: none;
      border: 1px solid #b39264;
    }
    button:disabled {
      opacity: 0.5;
      pointer-events: none;
    }

    .summary-box {
      background: #f4ede2;
      border-radius: 24px;
      padding: 1rem;
      margin: 1rem 0;
    }
    hr {
      border: 0.5px solid #dcc29e;
      margin: 1rem 0;
    }
    .error-message {
      color: #c04e3a;
      font-size: 0.85rem;
      margin-top: -0.5rem;
      margin-bottom: 0.8rem;
    }

    .selected-category-tag {
      display: inline-block;
      background: #d4af37;
      color: #2e2412;
      padding: 0.2rem 0.8rem;
      border-radius: 20px;
      font-size: 0.8rem;
      margin: 0.2rem;
      font-weight: 600;
    }
  </style>
</head>
<body>
<div class="container">
  <h1>📸 <span>גביע עפולה</span></h1>
  <div class="subtitle">רישום לצילום מקצועי · תחרות ריקוד</div>

  <div class="steps-indicator">
    <div class="step active" data-step="1">1. סוג צילום</div>
    <div class="step" data-step="2">2. פרטים אישיים</div>
    <div class="step" data-step="3">3. קטגוריות</div>
    <div class="step" data-step="4">4. סיכום</div>
  </div>

  <form id="registrationForm" action="https://formsubmit.co/2mmedia.il@gmail.com" method="POST">
    <!-- שלב 1: סוג רישום וצילום -->
    <div class="form-step active-step" id="step1">
      <label>סוג רישום:</label>
      <div class="radio-group" id="regTypeGroup">
        <div class="radio-option"><input type="radio" name="registrationType" value="free" id="regFree" checked> <label for="regFree">חינם</label></div>
        <div class="radio-option"><input type="radio" name="registrationType" value="paid" id="regPaid"> <label for="regPaid">מסלול פרימיום (10 ש"ח לקטגוריה)</label></div>
      </div>
      <small style="color:#5e4a32;">✨ מסלול פרימיום מעניק עדיפות בצילום</small>

      <label style="margin-top:1.5rem;">אני מעוניין/ת ב:</label>
      <div class="radio-group">
        <div class="radio-option"><input type="radio" name="mediaType" value="photo" id="photoOnly" checked> <label for="photoOnly">צילום סטילס בלבד</label></div>
        <div class="radio-option"><input type="radio" name="mediaType" value="video" id="videoOnly"> <label for="videoOnly">וידאו בלבד</label></div>
        <div class="radio-option"><input type="radio" name="mediaType" value="both" id="bothMedia"> <label for="bothMedia">גם סטילס וגם וידאו</label></div>
      </div>
      <div class="nav-buttons">
        <div></div>
        <button type="button" id="toStep2">המשך ➡️</button>
      </div>
    </div>

    <!-- שלב 2: פרטי רקדנים -->
    <div class="form-step" id="step2">
      <label>סוג ריקוד:</label>
      <div class="radio-group">
        <div class="radio-option"><input type="radio" name="danceType" value="solo" id="solo" checked> <label for="solo">סולו</label></div>
        <div class="radio-option"><input type="radio" name="danceType" value="couple" id="couple"> <label for="couple">זוג</label></div>
      </div>

      <div id="soloFields">
        <label>שם מלא של הרקדן/ית</label>
        <input type="text" name="soloFullName" placeholder="ישראל ישראלי" id="soloNameInput">
        <label>אינסטגרם (Instagram) של הרקדן/ית</label>
        <input type="text" name="soloInstagram" placeholder="@username" id="soloInstagramInput">
      </div>
      <div id="coupleFields" style="display:none;">
        <label>שם מלא של הרקדן</label>
        <input type="text" name="partnerMale" placeholder="שם פרטי + משפחה" id="maleNameInput">
        <label>אינסטגרם (Instagram) של הרקדן</label>
        <input type="text" name="partnerMaleInstagram" placeholder="@username" id="maleInstagramInput">
        <label>שם מלא של הרקדנית</label>
        <input type="text" name="partnerFemale" placeholder="שם פרטי + משפחה" id="femaleNameInput">
        <label>אינסטגרם (Instagram) של הרקדנית</label>
        <input type="text" name="partnerFemaleInstagram" placeholder="@username" id="femaleInstagramInput">
      </div>

      <label>טלפון ליצירת קשר</label>
      <input type="tel" name="phone" placeholder="050-0000000" required>
      <label>דוא"ל</label>
      <input type="email" name="email" placeholder="your@email.com" required>

      <div class="nav-buttons">
        <button type="button" class="secondary" id="backTo1">⬅️ חזרה</button>
        <button type="button" id="toStep3">המשך לקטגוריות ➡️</button>
      </div>
    </div>

    <!-- שלב 3: קטגוריות (בחירה מרובה) -->
    <div class="form-step" id="step3">
      <p style="font-weight:bold; margin-bottom:0.5rem;">בחר קטגוריות (ניתן לבחור מספר):</p>
      <div id="categoriesContainer" style="max-height: 450px; overflow-y: auto; padding-left: 5px;">
        <!-- ימולא דינמית -->
      </div>
      <div style="margin-top: 1rem; background: #fefae0; padding: 0.6rem; border-radius: 16px;">
        <span style="font-weight: bold;">קטגוריות שנבחרו: </span>
        <span id="selectedCategoriesPreview" style="color: #5e4a32;">לא נבחרו קטגוריות</span>
      </div>
      <div class="nav-buttons">
        <button type="button" class="secondary" id="backTo2">⬅️ חזרה</button>
        <button type="button" id="toStep4">לסיכום ➡️</button>
      </div>
    </div>

    <!-- שלב 4: סיכום -->
    <div class="form-step" id="step4">
      <h3 style="color:#3a2c1b; margin-bottom:1rem;">✅ סיכום הרישום</h3>
      <div id="summaryContent" class="summary-box"></div>
      <div class="nav-buttons">
        <button type="button" class="secondary" id="backTo3">⬅️ חזרה</button>
        <button type="submit" id="submitBtn">שלח רישום ✉️</button>
      </div>
    </div>
  </form>
</div>

<script>
  (function() {
    const categories = {
      "חלק א": {
        "Medalist": ["3-5: סולו", "3-5: זוגות"],
        "N2": ["5-7 סולו", "5-7 זוגות", "8-9 סולו", "8-9 זוגות", "10-11 סולו", "10-11 זוגות", "12-15 סולו", "12-15 זוגות"],
        "N3": ["5-7 סולו", "5-7 זוגות", "8-9 סולו", "8-9 זוגות", "10-11 סולו", "10-11 זוגות", "12-15 סולו", "12-15 זוגות"],
        "H": ["5-7 סולו", "5-7 זוגות", "8-9 סולו", "8-9 זוגות", "10-11 סולו", "10-11 זוגות", "12-15 סולו", "12-15 זוגות"],
        "F": ["5-7 סולו", "5-7 זוגות", "8-9 סולו", "8-9 זוגות", "10-11 סולו", "10-11 זוגות"],
        "LA E": ["5-7 סולו", "5-7 זוגות", "8-9 סולו", "8-9 זוגות", "10-11 סולו", "10-11 זוגות"],
        "ST E": ["5-7 סולו", "5-7 זוגות", "8-9 סולו", "8-9 זוגות", "10-11 סולו", "10-11 זוגות"],
        "LA D": ["6-11 סולו", "6-11 זוגות"],
        "ST D": ["6-11 סולו", "6-11 זוגות"],
        "Waltz": ["6-9 סולו", "6-9 זוגות", "10-11 סולו", "10-11 זוגות"],
        "ChaCha": ["6-9 סולו", "6-9 זוגות", "10-11 סולו", "10-11 זוגות"],
        "Formation": ["6-11", "12-15"]
      },
      "חלק ב": {
        "F": ["12-13 סולו", "12-13 זוגות", "14-15 סולו", "14-15 זוגות", "16+ סולו", "16+ זוגות"],
        "E": ["12-13 סולו", "12-13 זוגות", "14-15 סולו", "14-15 זוגות", "16+ סולו", "16+ זוגות"],
        "D": ["12-13 סולו", "12-13 זוגות", "14-15 סולו", "14-15 זוגות", "16+ סולו", "16+ זוגות"],
        "LA OPEN": ["12-13 סולו", "12-13 זוגות", "14-15 סולו", "14-15 זוגות", "16+ סולו", "16+ זוגות"],
        "ST OPEN": ["12-13 סולו", "12-13 זוגות", "14-15 סולו", "14-15 זוגות", "16+ סולו", "16+ זוגות"],
        "Tango": ["12-13 סולו", "12-13 זוגות", "14+ סולו", "14+ זוגות"],
        "Rumba": ["12-13 סולו", "14+ סולו"],
        "Samba": ["12-13", "14+"]
      }
    };

    const form = document.getElementById('registrationForm');
    const steps = document.querySelectorAll('.form-step');
    const stepIndicators = document.querySelectorAll('.step');
    let currentStep = 1;

    function showStep(step) {
      steps.forEach(s => s.classList.remove('active-step'));
      document.getElementById(`step${step}`).classList.add('active-step');
      stepIndicators.forEach(ind => ind.classList.remove('active'));
      document.querySelector(`.step[data-step="${step}"]`).classList.add('active');
      currentStep = step;
      if (step === 4) updateSummary();
    }

    document.getElementById('toStep2').addEventListener('click', ()=> showStep(2));
    document.getElementById('backTo1').addEventListener('click', ()=> showStep(1));
    document.getElementById('toStep3').addEventListener('click', ()=> { renderCategories(); showStep(3); });
    document.getElementById('backTo2').addEventListener('click', ()=> showStep(2));
    document.getElementById('toStep4').addEventListener('click', ()=> { updateSummary(); showStep(4); });
    document.getElementById('backTo3').addEventListener('click', ()=> showStep(3));

    const soloRadio = document.getElementById('solo');
    const coupleRadio = document.getElementById('couple');
    const soloFields = document.getElementById('soloFields');
    const coupleFields = document.getElementById('coupleFields');

    function toggleDanceFields() {
      if (coupleRadio.checked) {
        soloFields.style.display = 'none';
        coupleFields.style.display = 'block';
      } else {
        soloFields.style.display = 'block';
        coupleFields.style.display = 'none';
      }
    }
    soloRadio.addEventListener('change', toggleDanceFields);
    coupleRadio.addEventListener('change', toggleDanceFields);
    toggleDanceFields();

    function renderCategories() {
      const container = document.getElementById('categoriesContainer');
      container.innerHTML = '';
      for (let [part, groups] of Object.entries(categories)) {
        const partHeader = document.createElement('h4');
        partHeader.style.margin = '0.8rem 0 0.4rem';
        partHeader.textContent = part;
        partHeader.style.color = '#4a3820';
        container.appendChild(partHeader);
        for (let [group, items] of Object.entries(groups)) {
          items.forEach(item => {
            const fullName = `${group} - ${item}`;
            const div = document.createElement('div');
            div.className = 'category-card';
            const cb = document.createElement('input');
            cb.type = 'checkbox';
            cb.name = 'categories';
            cb.value = fullName;
            cb.id = `cat_${fullName.replace(/\s+/g,'_').replace(/[^a-zA-Z0-9_]/g,'')}`;
            cb.addEventListener('change', updateSelectedPreview);
            const lbl = document.createElement('label');
            lbl.htmlFor = cb.id;
            lbl.textContent = fullName;
            div.appendChild(cb);
            div.appendChild(lbl);
            container.appendChild(div);
          });
        }
      }
      updateSelectedPreview();
    }

    function getSelectedCategories() {
      return Array.from(document.querySelectorAll('input[name="categories"]:checked')).map(cb => cb.value);
    }

    function updateSelectedPreview() {
      const previewSpan = document.getElementById('selectedCategoriesPreview');
      if (!previewSpan) return;
      const selected = getSelectedCategories();
      if (selected.length === 0) {
        previewSpan.innerHTML = 'לא נבחרו קטגוריות';
        return;
      }
      previewSpan.innerHTML = selected.map(cat => `<span class="selected-category-tag">${cat}</span>`).join(' ');
    }

    function updateSummary() {
      const regType = document.querySelector('input[name="registrationType"]:checked')?.value;
      const media = document.querySelector('input[name="mediaType"]:checked')?.value;
      const dance = document.querySelector('input[name="danceType"]:checked')?.value;
      let dancerInfo = '';
      let instagramInfo = '';
      
      if (dance === 'solo') {
        const soloName = document.getElementById('soloNameInput')?.value || '(לא צוין)';
        const soloInsta = document.getElementById('soloInstagramInput')?.value || 'לא צוין';
        dancerInfo = soloName;
        instagramInfo = `אינסטגרם רקדן/ית: ${soloInsta}`;
      } else {
        const male = document.getElementById('maleNameInput')?.value || '';
        const female = document.getElementById('femaleNameInput')?.value || '';
        const maleInsta = document.getElementById('maleInstagramInput')?.value || 'לא צוין';
        const femaleInsta = document.getElementById('femaleInstagramInput')?.value || 'לא צוין';
        dancerInfo = `רקדן: ${male}, רקדנית: ${female}`;
        instagramInfo = `אינסטגרם רקדן: ${maleInsta}, רקדנית: ${femaleInsta}`;
      }
      
      const phone = document.querySelector('input[name="phone"]')?.value || '-';
      const email = document.querySelector('input[name="email"]')?.value || '-';
      const cats = getSelectedCategories();
      const paidText = regType === 'paid' ? 'פרימיום (10 ש"ח לקטגוריה)' : 'חינם';
      const mediaText = media === 'photo' ? 'סטילס' : media==='video' ? 'וידאו' : 'סטילס+וידאו';

      document.getElementById('summaryContent').innerHTML = `
        <p><strong>מסלול:</strong> ${paidText}</p>
        <p><strong>סוג מדיה:</strong> ${mediaText}</p>
        <p><strong>ריקוד:</strong> ${dance==='solo'?'סולו':'זוג'}</p>
        <p><strong>שם/ות:</strong> ${dancerInfo}</p>
        <p><strong>${instagramInfo}</strong></p>
        <p><strong>טלפון:</strong> ${phone}</p>
        <p><strong>דוא"ל:</strong> ${email}</p>
        <p><strong>קטגוריות:</strong> ${cats.length ? cats.join(', ') : 'לא נבחרו'}</p>
      `;
    }

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      const cats = getSelectedCategories();
      if (cats.length === 0) {
        alert('יש לבחור לפחות קטגוריה אחת');
        showStep(3);
        return;
      }
      const dance = document.querySelector('input[name="danceType"]:checked').value;
      if (dance === 'solo' && !document.getElementById('soloNameInput').value.trim()) {
        alert('נא למלא שם רקדן/ית בסולו');
        showStep(2);
        return;
      }
      if (dance === 'couple') {
        const m = document.getElementById('maleNameInput').value.trim();
        const f = document.getElementById('femaleNameInput').value.trim();
        if (!m || !f) {
          alert('יש למלא שמות שני הרקדנים');
          showStep(2);
          return;
        }
      }
      alert('הטופס נשלח בהצלחה! תודה שנרשמת.');
      form.submit();
    });

    renderCategories();
  })();
</script>
</body>
</html>
