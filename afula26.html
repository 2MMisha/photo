<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>גביע עפולה - רישום לצילום</title>
<style>
body{background:#000;color:#fff;font-family:Arial,sans-serif;margin:0;padding:20px}
.container{max-width:900px;margin:auto;background:#111;padding:25px;border-radius:20px}
input,select,textarea{width:100%;padding:12px;margin:6px 0 14px;background:#1a1a1a;color:#fff;border:1px solid #444;border-radius:10px}
button{background:#fff;color:#000;border:none;padding:12px 20px;border-radius:10px;font-weight:bold;cursor:pointer}
.category{display:block;margin:6px 0}
</style>
</head>
<body>
<div class="container">
<h1>טופס רישום לצילום - גביע עפולה</h1>

<form action="https://formsubmit.co/2mmedia.il@gmail.com" method="POST">
<input type="hidden" name="selected_categories" id="selected_categories">

<h3>סוג רישום</h3>
<label><input type="radio" name="registrationType" value="free" checked> חינם</label>
<label><input type="radio" name="registrationType" value="paid"> פרימיום</label>

<h3>סוג ריקוד</h3>
<label><input type="radio" name="danceType" value="solo" checked onclick="toggleMode()"> סולו</label>
<label><input type="radio" name="danceType" value="couple" onclick="toggleMode()"> זוג</label>

<div id="soloBlock">
<input type="text" name="soloFullName" placeholder="שם הרקדן/ית">
<input type="text" name="soloInstagram" placeholder="@instagram">
</div>

<div id="coupleBlock" style="display:none">
<input type="text" name="partnerMale" placeholder="שם הרקדן">
<input type="text" name="partnerMaleInstagram" placeholder="Instagram רקדן">
<input type="text" name="partnerFemale" placeholder="שם הרקדנית">
<input type="text" name="partnerFemaleInstagram" placeholder="Instagram רקדנית">
</div>

<input type="tel" name="phone" placeholder="טלפון" required>
<input type="email" name="email" placeholder="Email" required>

<h3>קטגוריות</h3>

<label class="category"><input type="checkbox" name="categories[]" value="F - 12-13 סולו">F - 12-13 סולו</label>
<label class="category"><input type="checkbox" name="categories[]" value="F - 12-13 זוגות">F - 12-13 זוגות</label>
<label class="category"><input type="checkbox" name="categories[]" value="LA OPEN - 14-15 זוגות">LA OPEN - 14-15 זוגות</label>
<label class="category"><input type="checkbox" name="categories[]" value="ST OPEN - 14-15 זוגות">ST OPEN - 14-15 זוגות</label>

<br><br>
<button type="submit">שלח</button>
</form>
</div>

<script>
function toggleMode(){
 const solo=document.querySelector('input[value="solo"]').checked;
 document.getElementById('soloBlock').style.display=solo?'block':'none';
 document.getElementById('coupleBlock').style.display=solo?'none':'block';
}

document.querySelector('form').addEventListener('submit',function(){
 const cats=[...document.querySelectorAll('input[name="categories[]"]:checked')]
 .map(x=>x.value).join('\n');
 document.getElementById('selected_categories').value=cats;
});
</script>
</body>
</html>
