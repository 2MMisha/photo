<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>הרישום בוצע בהצלחה | גביע עפולה</title>
    <link rel="icon" type="image/png" href="icon.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 50%, #0a0a0a 100%);
            font-family: 'Segoe UI', 'Assistant', 'Rubik', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            margin: 0;
            direction: rtl;
            position: relative;
            overflow-x: hidden;
        }

        /* Декоративные элементы фона */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 50%, rgba(212, 175, 55, 0.03) 0%, transparent 50%),
                        radial-gradient(circle at 70% 30%, rgba(212, 175, 55, 0.02) 0%, transparent 50%);
            animation: rotate 30s linear infinite;
            z-index: 0;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .container {
            width: 100%;
            max-width: 650px;
            position: relative;
            z-index: 1;
        }

        .success-card {
            background: #1a1a1a;
            border-radius: 40px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), 
                        0 10px 30px rgba(212, 175, 55, 0.15),
                        inset 0 1px 0 rgba(255, 255, 255, 0.05);
            padding: 3rem 2.5rem;
            border: 1px solid #333;
            text-align: center;
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo-container {
            margin-bottom: 1.5rem;
        }

        .logo-container img {
            max-width: 160px;
            height: auto;
            filter: drop-shadow(0 4px 12px rgba(212, 175, 55, 0.3));
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .success-icon {
            font-size: 5rem;
            margin-bottom: 1.5rem;
            animation: popIn 0.5s ease-out 0.3s both;
        }

        @keyframes popIn {
            0% {
                transform: scale(0);
                opacity: 0;
            }
            70% {
                transform: scale(1.1);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            color: #d4af37;
            margin-bottom: 0.8rem;
            letter-spacing: 1px;
            animation: fadeIn 0.6s ease-out 0.5s both;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .subtitle {
            color: #cccccc;
            font-size: 1.2rem;
            margin-bottom: 2rem;
            animation: fadeIn 0.6s ease-out 0.7s both;
        }

        .details-box {
            background: linear-gradient(135deg, #2a2a2a 0%, #222 100%);
            border-radius: 24px;
            padding: 1.5rem;
            margin: 2rem 0;
            border: 1px solid #444;
            text-align: right;
            animation: fadeIn 0.6s ease-out 0.9s both;
        }

        .details-box h3 {
            color: #d4af37;
            margin-bottom: 1rem;
            font-size: 1.2rem;
            text-align: center;
        }

        .detail-item {
            display: flex;
            justify-content: space-between;
            padding: 0.5rem 0;
            border-bottom: 1px solid #333;
            color: #ffffff;
        }

        .detail-item:last-child {
            border-bottom: none;
        }

        .detail-item strong {
            color: #d4af37;
        }

        .whatsapp-info {
            background: linear-gradient(135deg, #1a3a2a 0%, #0f2a1a 100%);
            border: 2px solid #25D366;
            border-radius: 20px;
            padding: 1.2rem;
            margin: 1.5rem 0;
            color: #ffffff;
            text-align: center;
            animation: fadeIn 0.6s ease-out 1.1s both;
        }

        .whatsapp-info a {
            color: #25D366;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.1rem;
            display: inline-block;
            margin-top: 0.5rem;
            transition: transform 0.3s;
        }

        .whatsapp-info a:hover {
            transform: scale(1.05);
        }

        .button-group {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
            animation: fadeIn 0.6s ease-out 1.3s both;
            flex-wrap: wrap;
        }

        .btn {
            flex: 1;
            min-width: 200px;
            padding: 1rem 2rem;
            border-radius: 35px;
            font-size: 1.1rem;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #d4af37 0%, #c9a52c 100%);
            color: #000;
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(212, 175, 55, 0.6);
            background: linear-gradient(135deg, #e0bb4a 0%, #d4af37 100%);
        }

        .btn-secondary {
            background: #333;
            color: #ffffff;
            border: 2px solid #555;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .btn-secondary:hover {
            background: #444;
            transform: translateY(-3px);
            border-color: #d4af37;
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.2);
        }

        .confetti {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1000;
        }

        .confetti-piece {
            position: absolute;
            width: 10px;
            height: 10px;
            top: -10px;
            animation: confettiFall linear forwards;
        }

        @keyframes confettiFall {
            to {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }

        @media (max-width: 480px) {
            .success-card {
                padding: 2rem 1.5rem;
                border-radius: 30px;
            }

            h1 {
                font-size: 1.8rem;
            }

            .subtitle {
                font-size: 1rem;
            }

            .success-icon {
                font-size: 3.5rem;
            }

            .button-group {
                flex-direction: column;
            }

            .btn {
                width: 100%;
                min-width: unset;
            }

            .logo-container img {
                max-width: 120px;
            }
        }
    </style>
</head>
<body>
    <!-- Конфетти -->
    <div class="confetti" id="confetti"></div>

    <div class="container">
        <div class="success-card">
            <!-- Логотип -->
            <div class="logo-container">
                <img src="logo.png" alt="לוגו גביע עפולה" onerror="this.style.display='none'; this.parentElement.innerHTML='<div class=\'success-icon\'>🏆</div>';">
            </div>

            <!-- Иконка успеха -->
            <div class="success-icon">✅</div>

            <!-- Заголовок -->
            <h1>הרישום בוצע בהצלחה!</h1>
            <div class="subtitle">🎉 תודה שנרשמתם לצילום בגביע עפולה</div>

            <!-- Детали -->
            <div class="details-box">
                <h3>📋 מה הלאה?</h3>
                <div class="detail-item">
                    <span>📱</span>
                    <strong>ניצור קשר לפני התחרות</strong>
                </div>
                <div class="detail-item">
                    <span>📸</span>
                    <strong>נדאג לצלם אתכם בקטגוריות שבחרתם</strong>
                </div>
            </div>

            <!-- WhatsApp информация -->
            <div class="whatsapp-info">
                💬 <strong>יש שאלות? אנחנו זמינים בוואטסאפ</strong><br>
                <a href="https://wa.me/972547798676" target="_blank">
                    📱 שלחו הודעה עכשיו ← 054-7798676
                </a>
            </div>

            <!-- Кнопки -->
            <div class="button-group">
                <a href="index.html" class="btn btn-primary">
                    📝 שלח רישום נוסף
                </a>
                <a href="https://wa.me/972547798676" target="_blank" class="btn btn-secondary">
                    💬 וואטסאפ
                </a>
            </div>
        </div>
    </div>

    <script>
        // Анимация конфетти
        function createConfetti() {
            const confettiContainer = document.getElementById('confetti');
            const colors = ['#d4af37', '#ff6b6b', '#4ecdc4', '#45b7d1', '#f9ca24', '#6c5ce7', '#a8e6cf', '#ffd93d'];
            
            for (let i = 0; i < 80; i++) {
                setTimeout(() => {
                    const piece = document.createElement('div');
                    piece.className = 'confetti-piece';
                    piece.style.left = Math.random() * 100 + '%';
                    piece.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    piece.style.width = (Math.random() * 10 + 5) + 'px';
                    piece.style.height = (Math.random() * 10 + 5) + 'px';
                    piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
                    piece.style.animationDuration = (Math.random() * 3 + 2) + 's';
                    piece.style.animationDelay = Math.random() * 2 + 's';
                    
                    confettiContainer.appendChild(piece);
                    
                    // Удаляем элемент после анимации
                    setTimeout(() => {
                        piece.remove();
                    }, 5000);
                }, i * 30);
            }
        }

        // Запускаем конфетти при загрузке
        window.addEventListener('load', () => {
            createConfetti();
            
            // Повторяем конфетти через 5 секунд
            setTimeout(createConfetti, 5000);
        });
    </script>
</body>
</html>
