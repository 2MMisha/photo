<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2M PHOTO — מחירון</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Arimo:ital,wght@0,400;0,500;0,600;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #000000;
            font-family: 'Arimo', 'Arial', sans-serif;
            color: #ffffff;
            overflow-x: hidden;
            direction: rtl;
        }
        .glitch-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 40px;
            position: relative;
            z-index: 10;
        }
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px 0;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            margin-bottom: 60px;
            gap: 20px;
        }
        .logo-link {
            display: block;
            text-decoration: none;
            flex-shrink: 0;
        }
        .logo-img {
            height: 50px;
            width: auto;
            display: block;
            transition: opacity 0.3s;
        }
        .logo-img:hover {
            opacity: 0.7;
        }
        .by-media {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            flex-shrink: 0;
            transition: opacity 0.3s;
        }
        .by-media:hover {
            opacity: 0.6;
        }
        .by-text {
            font-family: 'Arimo', 'Arial', sans-serif;
            font-weight: 700;
            font-size: 0.8rem;
            letter-spacing: 2px;
            color: #ffffff;
            opacity: 0.5;
        }
        .media-logo {
            height: 30px;
            width: auto;
            display: block;
        }
        .nav-links {
            display: flex;
            gap: 40px;
            list-style: none;
            flex-wrap: wrap;
            justify-content: center;
        }
        .nav-links a {
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.1rem;
            text-transform: uppercase;
            transition: 0.3s;
            letter-spacing: 1px;
            white-space: nowrap;
        }
        .nav-links a:hover, .nav-links a.active {
            text-decoration: line-through;
        }
        h1 {
            font-weight: 700;
            font-size: clamp(4rem, 8vw, 7rem);
            letter-spacing: -5px;
            text-transform: uppercase;
            margin-bottom: 60px;
            line-height: 0.9;
            border-bottom: 4px solid #ffffff;
            display: inline-block;
            padding-bottom: 20px;
            text-align: right;
        }
        .price-table {
            border: 2px solid #ffffff;
            width: 100%;
        }
        .row {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            border-bottom: 2px solid #ffffff;
            padding: 30px 20px;
            align-items: center;
            font-weight: 600;
            font-size: 1.3rem;
            transition: 0.2s;
        }
        .row:last-child {
            border-bottom: none;
        }
        .row:hover {
            background-color: #ffffff;
            color: #000000;
        }
        .price {
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: -2px;
            text-align: left;
        }
        .service-name {
            text-align: right;
        }
        .duration {
            text-align: right;
        }
        .btn {
            display: inline-block;
            background-color: #ffffff;
            color: #000000;
            font-weight: 700;
            font-size: 1.2rem;
            padding: 18px 40px;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 2px;
            border: 2px solid #ffffff;
            transition: 0.2s;
            margin-top: 50px;
        }
        .btn:hover {
            background-color: transparent;
            color: #ffffff;
        }
        .note {
            margin-top: 40px;
            font-size: 1.2rem;
            font-weight: 500;
            text-align: right;
        }
        footer {
            border-top: 1px solid #ffffff;
            padding: 30px 0;
            margin-top: 80px;
            text-align: center;
            font-weight: 600;
            letter-spacing: 2px;
            direction: rtl;
        }

        @media (max-width: 768px) {
            nav {
                flex-direction: column;
                gap: 15px;
                align-items: center;
            }
            .nav-links {
                gap: 15px;
            }
            .nav-links a {
                font-size: 0.85rem;
            }
            .row {
                grid-template-columns: 1fr 1fr 1fr;
                font-size: 1rem;
                padding: 20px 15px;
            }
            .price {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="glitch-grid"></div>
    <div class="container">
        <!-- ХЕДЕР -->
        <nav>
            <a href="index.html" class="logo-link">
                <img src="../logo.png" alt="2M Photo" class="logo-img">
            </a>
            <ul class="nav-links">
                <li><a href="index.html">ראשי</a></li>
                <li><a href="about.html">אודות</a></li>
                <li><a href="#" class="active">מחירון</a></li>
                <li><a href="contact.html">צור קשר</a></li>
            </ul>
            <a href="https://2mmedia.co" target="_blank" class="by-media">
                <span class="by-text">BY</span>
                <img src="../2m.png" alt="2M Media" class="media-logo">
            </a>
        </nav>

        <h1>כמה<br>עולה</h1>

        <div class="price-table">
            <div class="row">
            <h2>כרגע איו כלום פה...</h2>
			<span>אבל את/ה תמיד יכול/ה ליצור קשר איתנו</span>
            </div>
        </div>

        <p class="note">
            * העמוד יתעדכן בהמשך - כרגע ניתן לקבל הוצאת מחיר דרך עמוד יצירת קשר
        </p>

        <a href="contact.html" class="btn">צור קשר</a>

        <footer>
            © 2M MEDIA — המחיר מוצדק בהשכלה.
        </footer>
    </div>
</body>
</html>
