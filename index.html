<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- ========== SEO: ОСНОВНОЕ (ENGLISH) ========== -->
    <title>2M PHOTO — Professional Photo & Video Production | ARRI, RED, Sony</title>
    <meta name="description" content="2M Photo by 2M Media — premium photo and video production. Professional crew with academic background in video production. ARRI, RED, Sony equipment. Photography, videography, commercial production.">
    <meta name="keywords" content="photo production, video production, photography, videography, ARRI, RED, Sony, 2M Photo, 2M Media, commercial shoot, professional camera">
    <meta name="author" content="2M Media">
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large">

    <!-- ========== OPEN GRAPH ========== -->
    <meta property="og:title" content="2M PHOTO — Professional Photo & Video Production">
    <meta property="og:description" content="Premium production with academic background. ARRI, RED, Sony equipment. Photo and video shooting at the highest level.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://2mmedia.co/photo/">
    <meta property="og:site_name" content="2M Photo by 2M Media">
    <meta property="og:locale" content="en_US">

    <!-- ========== ALTERNATE ЯЗЫКОВЫЕ ВЕРСИИ ДЛЯ SEO ========== -->
    <link rel="alternate" hreflang="ru" href="https://2mmedia.co/photo/ru/">
    <link rel="alternate" hreflang="en" href="https://2mmedia.co/photo/en/">
    <link rel="alternate" hreflang="he" href="https://2mmedia.co/photo/he/">
    <link rel="alternate" hreflang="x-default" href="https://2mmedia.co/photo/en/">

    <!-- ========== CANONICAL ========== -->
    <link rel="canonical" href="https://2mmedia.co/photo/">

    <!-- ========== СТРУКТУРИРОВАННЫЕ ДАННЫЕ Organization ========== -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "2M Photo",
        "alternateName": ["2M Photo by 2M Media", "2M Фото"],
        "parentOrganization": {
            "@type": "Organization",
            "name": "2M Media"
        },
        "description": "Professional photo and video production with academic background. ARRI, RED, Sony equipment.",
        "url": "https://2mmedia.co/photo/",
        "logo": "https://2mmedia.co/photo/../2m.png",
        "contactPoint": {
            "@type": "ContactPoint",
            "contactType": "customer service",
            "availableLanguage": ["Russian", "English", "Hebrew"]
        },
        "areaServed": {
            "@type": "Country",
            "name": ["Russia", "Israel", "United States"]
        }
    }
    </script>

    <!-- ========== СТРУКТУРИРОВАННЫЕ ДАННЫЕ WebSite ========== -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "2M Photo",
        "alternateName": "2M Photo by 2M Media",
        "url": "https://2mmedia.co/photo/",
        "description": "Professional photo and video production with academic background. ARRI, RED, Sony equipment.",
        "inLanguage": ["ru", "en", "he"],
        "potentialAction": {
            "@type": "SearchAction",
            "target": "https://2mmedia.co/photo/search?q={search_term_string}",
            "query-input": "required name=search_term_string"
        }
    }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Arimo:ital,wght@0,400;0,500;0,600;0,700;1,400;1,700&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000000;
            font-family: 'Arimo', 'Arial', sans-serif;
            color: #ffffff;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .glitch-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
        }
        .container {
            position: relative;
            z-index: 10;
            text-align: center;
        }
        .seo-title {
            font-weight: 700;
            font-size: clamp(3rem, 8vw, 6rem);
            letter-spacing: -5px;
            text-transform: uppercase;
            opacity: 0.15;
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            white-space: nowrap;
            pointer-events: none;
        }
        .logo {
            font-weight: 700;
            font-size: 6rem;
            letter-spacing: -6px;
        }
    </style>
</head>
<body>
    <div class="glitch-grid"></div>

    <div class="container">
        <!-- Скрытый SEO-контент -->
        <h1 style="font-weight:700;font-size:0;position:absolute;opacity:0;pointer-events:none;">2M Photo by 2M Media — Professional Photography & Video Production Services</h1>
        
        <!-- Декоративный водяной знак -->
        <div class="seo-title">2M PHOTO</div>
        
        <!-- Видимый логотип (мигает долю секунды) -->
        <div class="logo">2M</div>
    </div>

    <!-- МГНОВЕННЫЙ РЕДИРЕКТ -->
    <script>
        (function() {
            var lang = (navigator.language || 'en').split('-')[0].toLowerCase();
            
            if (lang === 'ru') {
                window.location.replace('ru/index.html');
            } else if (lang === 'he') {
                window.location.replace('he/index.html');
            } else {
                window.location.replace('en/index.html');
            }
        })();
    </script>
</body>
</html>
