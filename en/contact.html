<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2M PHOTO — КОНТАКТ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Arimo:ital,wght@0,400;0,500;0,600;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #000000;
            font-family: 'Arimo', 'Arial', sans-serif;
            color: #ffffff;
            overflow-x: hidden;
        }
        .glitch-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 40px;
            position: relative;
            z-index: 10;
        }

        /* === ОБНОВЛЁННЫЙ ХЕДЕР === */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px 0;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            margin-bottom: 60px;
            gap: 20px;
        }
        .logo-link {
            display: block;
            text-decoration: none;
            flex-shrink: 0;
        }
        .logo-img {
            height: 50px;
            width: auto;
            display: block;
            transition: opacity 0.3s;
        }
        .logo-img:hover {
            opacity: 0.7;
        }
        .by-media {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            flex-shrink: 0;
            transition: opacity 0.3s;
        }
        .by-media:hover {
            opacity: 0.6;
        }
        .by-text {
            font-family: 'Arimo', 'Arial', sans-serif;
            font-weight: 700;
            font-size: 0.8rem;
            letter-spacing: 2px;
            color: #ffffff;
            opacity: 0.5;
        }
        .media-logo {
            height: 30px;
            width: auto;
            display: block;
        }
        .nav-links {
            display: flex;
            gap: 40px;
            list-style: none;
            flex-wrap: wrap;
            justify-content: center;
        }
        .nav-links a {
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.1rem;
            text-transform: uppercase;
            transition: 0.3s;
            letter-spacing: 1px;
            white-space: nowrap;
        }
        .nav-links a:hover, .nav-links a.active {
            text-decoration: line-through;
        }

        h1 {
            font-weight: 700;
            font-size: clamp(5rem, 10vw, 9rem);
            letter-spacing: -6px;
            text-transform: uppercase;
            line-height: 0.85;
            margin-bottom: 60px;
        }
        .contact-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0;
            border: 2px solid #ffffff;
        }
        .info-block {
            padding: 50px;
            border-right: 2px solid #ffffff;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }
        .info-item h3 {
            font-size: 0.9rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 10px;
            opacity: 0.7;
        }
        .info-item p {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -1px;
        }
        .form-block {
            padding: 50px;
            background-color: #0a0a0a;
        }
        input, textarea {
            width: 100%;
            background: transparent;
            border: 2px solid #ffffff;
            padding: 18px;
            color: #ffffff;
            font-family: 'Arimo', 'Arial', sans-serif;
            font-weight: 600;
            font-size: 1.1rem;
            margin-bottom: 20px;
            text-transform: uppercase;
        }
        input::placeholder, textarea::placeholder {
            color: rgba(255,255,255,0.6);
            letter-spacing: 1px;
        }
        .btn {
            width: 100%;
            background-color: #ffffff;
            color: #000000;
            font-weight: 700;
            font-size: 1.2rem;
            padding: 18px;
            text-transform: uppercase;
            letter-spacing: 2px;
            border: 2px solid #ffffff;
            cursor: pointer;
            font-family: 'Arimo', 'Arial', sans-serif;
        }
        .btn:hover {
            background-color: transparent;
            color: #ffffff;
        }
        footer {
            border-top: 1px solid #ffffff;
            padding: 30px 0;
            margin-top: 80px;
            text-align: center;
            font-weight: 600;
            letter-spacing: 2px;
        }

        @media (max-width: 768px) {
            nav {
                flex-direction: column;
                gap: 15px;
                align-items: center;
            }
            .nav-links {
                gap: 15px;
            }
            .nav-links a {
                font-size: 0.85rem;
            }
            .contact-grid {
                grid-template-columns: 1fr;
            }
            .info-block {
                border-right: none;
                border-bottom: 2px solid #ffffff;
            }
        }
    </style>
</head>
<body>
    <div class="glitch-grid"></div>
    <div class="container">
        <!-- ОБНОВЛЁННЫЙ ХЕДЕР -->
        <nav>
            <a href="index.html" class="logo-link">
                <img src="../logo.png" alt="2M Photo" class="logo-img">
            </a>
            <ul class="nav-links">
                <li><a href="index.html">Главная</a></li>
                <li><a href="about.html">О нас</a></li>
                <li><a href="price.html">Прайс</a></li>
                <li><a href="#" class="active">Контакты</a></li>
            </ul>
            <a href="https://2mmedia.co" target="_blank" class="by-media">
                <span class="by-text">BY</span>
                <img src="../2m.png" alt="2M Media" class="media-logo">
            </a>
        </nav>

        <h1>ВЫЙТИ<br>НА СВЯЗЬ</h1>

        <div class="contact-grid">
            <div class="info-block">
                <div class="info-item">
                    <h3>Телефон для смелых</h3>
                    <p>+7 999 123 45 67</p>
                </div>
                <div class="info-item">
                    <h3>Почта</h3>
                    <p>PROD@2MMEDIA.RU</p>
                </div>
                <div class="info-item">
                    <h3>Локация</h3>
                    <p>МОСКВА, ЦЕНТР ДИЗАЙНА ARTPLAY</p>
                </div>
                <div style="font-size: 2rem; font-weight: 700; margin-top: 20px;">
                    РАБОТАЕМ 24/7 ДЛЯ БЕЗУМЦЕВ
                </div>
            </div>
            <div class="form-block">
                <form>
                    <input type="text" placeholder="Имя">
                    <input type="text" placeholder="Телефон или почта">
                    <textarea placeholder="Опиши задачу. Мы любим сложное." rows="4"></textarea>
                    <button class="btn" type="submit">ОТПРАВИТЬ ЗАПРОС</button>
                </form>
            </div>
        </div>

        <footer>
            © 2M MEDIA — НЕ СТЕСНЯЙСЯ. ЗВОНИ СЕЙЧАС.
        </footer>
    </div>
</body>
</html>
